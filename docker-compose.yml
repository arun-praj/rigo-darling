services:
  sushi:
    build:
      context: .
      network: host
    container_name: sushi
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      BROWSER_HEADLESS: "false"
      DISPLAY: ":99"
      SUSHI_DB_PATH: /app/data/rigohr.sqlite
      SUSHI_BROWSER_PROFILE: /app/.browser-profile
    ports:
      - "0.0.0.0:4317:4317"
      - "0.0.0.0:6080:6080"
    volumes:
      - sushi_data:/app/data
      - sushi_browser_profile:/app/.browser-profile
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sushi_data:
    name: rigo-darling_rigo_data
  sushi_browser_profile:
    name: rigo-darling_rigo_browser_profile
